<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis bingos — Panel del organizador — BingoLive</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/organizador.css" />
</head>
<body>

  <header class="site-header">
    <div class="container org-topbar">
      <a class="brand" href="dashboard.html">
        <span class="brand__mark">B</span>
        <span>BingoLive</span>
      </a>
      <div class="org-topbar__user">
        <span class="org-topbar__avatar" id="user-initial">?</span>
        <span id="user-name">Cargando…</span>
        <button class="btn btn-ghost" id="btn-logout">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 32px 24px 80px;">
    <div class="org-page-head">
      <div>
        <h1>Mis bingos</h1>
        <p>Creá un nuevo bingo o entrá a uno existente para gestionarlo.</p>
      </div>
      <a class="btn btn-primary" href="crear-bingo.html">+ Crear bingo</a>
    </div>

    <div id="loading-state">
      <div class="skeleton" style="height: 180px; width: 100%; border-radius: 22px; margin-bottom: 16px;"></div>
      <div class="skeleton" style="height: 180px; width: 100%; border-radius: 22px;"></div>
    </div>

    <div id="empty-state" class="paper-card empty-panel" hidden>
      <h2 style="margin-bottom:8px;">Todavía no creaste ningún bingo</h2>
      <p style="margin-bottom:20px;">Empezá creando tu primer bingo: tarda menos de dos minutos.</p>
      <a class="btn btn-primary" href="crear-bingo.html">+ Crear mi primer bingo</a>
    </div>

    <div id="bingo-grid" class="bingo-grid" hidden></div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="../../assets/js/pages/organizador/dashboard.page.js"></script>
</body>
</html>
